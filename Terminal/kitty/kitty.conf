# Kitty configuration to match Tilix profile
font_family JetBrainsMono Nerd Font Mono
font_size 11

foreground #d4d4d8
background #181b28

# Cursor settings: use reverse video (cursor none) to match cursor-colors-set=false in Tilix
cursor none
cursor_blink_interval -1

# Tab bar position
tab_bar_edge top

# Opacity (0% transparency in Tilix)
background_opacity 1.0

# Color palette
color0  #000000
color1  #FF5454
color2  #50FA7B
color3  #F1FA8C
color4  #BD93F9
color5  #FF79C6
color6  #8BE8FD
color7  #BFBFBF
color8  #4D4D4D
color9  #FF6E67
color10 #5AF78D
color11 #F4F99D
color12 #CAA8FA
color13 #FF92D0
color14 #9AEDFE
color15 #E6E6E6

# Imagem de fundo – mantenha centralizada e proporcional ao redimensionar
background_image_layout scaled
background_image_alignment center
background_image_opacity 1.0